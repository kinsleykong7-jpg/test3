<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>Kinsley's Personal Space</title>

<style>
:root {
  --black: #111;
  --white: #fff;
  --gray: #666;
  --futura-font: Futura, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --typewriter-font: 'Courier Prime', Courier, 'Courier New', monospace;
}

*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#fff;color:var(--black)}

/* 4. 全局应用 Futura 字体 */
body {
  font-family: var(--futura-font);
  overflow-x: hidden;
  letter-spacing: 0.02em;
}

#snow {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 0;
}

/* 3. 蓝色雪花与高对比度可见的圆球 */
.flake {
  position: absolute;
  top: -30px;
  left: var(--x);
  opacity: var(--o);
  color: #4a90e2;
  font-size: var(--s);
  animation: fall var(--t) linear var(--d) infinite;
  user-select: none;
}
.flake.ball {
  width: var(--s);
  height: var(--s);
  border-radius: 50%;
  background: #333;
  box-shadow: 0 0 3px rgba(0,0,0,0.25);
}

@keyframes fall {
  to {
    /* 1. 轨迹贯穿整页，落到页面最下边音乐播放器下方并消失 */
    transform: translate3d(var(--drift), 115vh, 0) rotate(360deg);
  }
}

main {
  position: relative;
  z-index: 1;
  max-width: 900px;
  min-height: 100svh;
  margin: auto;
  padding: 32px 22px 38px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* 4. 顶部标题字体放大且采用 Futura */
header {
  font-family: var(--futura-font);
  font-size: 16px;
  font-weight: 700;
  letter-spacing: .22em;
  text-align: center;
  padding: 12px 0 22px;
  color: #111;
}

.scene {
  position: relative;
  width: 100%;
  height: 560px;
  overflow: hidden;
}

/* 雪人样式完全保持不变 */
.snowman {
  position: absolute;
  left: 50%;
  top: 48%;
  width: 270px;
  height: 340px;
  transform: translate(-50%,-50%) scale(.82);
  z-index: 3;
}

.head, .ball {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  border: 1.3px solid #222;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.96);
}

.head { top: 8px; width: 110px; height: 100px; }

.upper {
  top: 92px;
  width: 180px;
  height: 160px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.lower {
  top: 215px;
  width: 235px;
  height: 205px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.hat {
  position: absolute;
  z-index: 2;
  left: 50%;
  top: -4px;
  width: 50px;
  height: 40px;
  transform: translateX(-50%) rotate(7deg);
  background: #111;
}
.hat:after {
  content: "";
  position: absolute;
  bottom: -4px;
  left: -10px;
  width: 70px;
  height: 5px;
  background: #111;
  border-radius: 50%;
}

.eye {
  position: absolute;
  top: 43px;
  left: calc(50% - 15px);
  width: 5px;
  height: 5px;
  background: #111;
  border-radius: 50%;
  box-shadow: 25px 0 #111;
}
.nose {
  position: absolute;
  top: 56px;
  left: 50%;
  width: 16px;
  border-top: 1px solid #111;
  transform: rotate(10deg);
}
.arm {
  position: absolute;
  top: 132px;
  width: 65px;
  border-top: 1px solid #111;
}
.arm.l { right: calc(50% + 70px); transform: rotate(34deg); }
.arm.r { left: calc(50% + 70px); transform: rotate(-34deg); }
.arm:after {
  content: "";
  position: absolute;
  top: -7px;
  left: 0;
  width: 18px;
  border-top: 1px solid #111;
  transform: rotate(35deg);
}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KINSLEY'S PERSONAL SPACE</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #FFFFFF;
      color: #000000;
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
      position: relative;
    }

    /* 顶部标语 */
    header {
      position: absolute;
      top: 40px;
      width: 100%;
      text-align: center;
      letter-spacing: 0.35em;
      font-size: 13px;
      font-weight: 600;
      z-index: 10;
      text-transform: uppercase;
    }

    /* 雪人及倒计时容器 */
    .snowman-container {
      position: absolute;
      top: 46%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 5;
    }

    /* 极简解构风格雪人框 */
    .snowman-head {
      width: 140px;
      height: 140px;
      border: 1px solid #000000;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin-bottom: -15px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(2px);
    }

    .snowman-body {
      width: 210px;
      height: 210px;
      border: 1px solid #000000;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(2px);
    }

    .timer-val {
      font-size: 15px;
      font-weight: bold;
      letter-spacing: 0.1em;
    }

    .timer-label {
      font-size: 9px;
      margin-top: 4px;
      letter-spacing: 0.2em;
      color: #555555;
      text-transform: uppercase;
    }

    /* 画布（雪花与飘落字母） */
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    /* 底部播放器占位与沉积字母避让 */
    footer {
      position: absolute;
      bottom: 25px;
      width: 100%;
      text-align: center;
      font-size: 11px;
      letter-spacing: 0.15em;
      color: #666;
      z-index: 10;
    }
  </style>
</head>
<body>

  <header>KINSLEY'S PERSONAL SPACE</header>

  <!-- 黑白解构雪人倒计时 -->
  <div class="snowman-container">
    <div class="snowman-head">
      <div class="timer-val" id="hours-lived">000000:00:00</div>
      <div class="timer-label">HOURS LIVED</div>
    </div>
    <div class="snowman-body">
      <div class="timer-val" id="next-birthday">0000:00:00</div>
      <div class="timer-label">NEXT BIRTHDAY</div>
    </div>
  </div>

  <canvas id="snowCanvas"></canvas>

  <footer>
    [ 01 / 22 ] Clair de Lune — Debussy
  </footer>

  <script>
    // ------------------ 1. 倒计时逻辑 ------------------
    // 出生时间（已生活小时）
    const birthDate = new Date('2002-12-21T00:00:00');
    // 下一次生日时间 (2026-12-21 23:55)
    const nextBdayDate = new Date('2026-12-21T23:55:00');

    function updateTimers() {
      const now = new Date();

      // 已生活总时长计算
      const diffLivedSec = Math.floor((now - birthDate) / 1000);
      const hoursLived = Math.floor(diffLivedSec / 3600);
      const minsLived = Math.floor((diffLivedSec % 3600) / 60);
      const secsLived = diffLivedSec % 60;
      document.getElementById('hours-lived').innerText = 
        `${hoursLived}:${String(minsLived).padStart(2, '0')}:${String(secsLived).padStart(2, '0')}`;

      // 生日倒计时计算
      const diffBdaySec = Math.max(0, Math.floor((nextBdayDate - now) / 1000));
      const hoursBday = Math.floor(diffBdaySec / 3600);
      const minsBday = Math.floor((diffBdaySec % 3600) / 60);
      const secsBday = diffBdaySec % 60;
      document.getElementById('next-birthday').innerText = 
        `${hoursBday}:${String(minsBday).padStart(2, '0')}:${String(secsBday).padStart(2, '0')}`;
    }
    setInterval(updateTimers, 1000);
    updateTimers();

    // ------------------ 2. 雪花与字母下雪 Canvas ------------------
    const canvas = document.getElementById('snowCanvas');
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    // 背景普通雪花粒子（保持稀疏与
